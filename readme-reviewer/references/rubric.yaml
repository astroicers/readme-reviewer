# rubric.yaml — readme-reviewer 的唯一 canonical 判準
rubric_version: "0.2.0"
# 版本語意:major=規則增刪 / minor=權重或標註變更 / patch=文字修訂。
# lint_readme.py 硬編的值與本檔的一致性由其 --selftest 的 drift-guard 逐項斷言。

# ════════════════════════════════════════════════════════════════════════
# 證據性質(必讀,決定措辭紀律)
# ════════════════════════════════════════════════════════════════════════
#
# ⚠️ **本 rubric 的權重與門檻是「選的」,不是「量出來的」。**
#
# 姊妹專案 skill-quality-research 的 packaging 權重來自 97 個 repo 的星數梯度,
# 有 bootstrap CI 可查。**本專案沒有那個東西**,不得複製那套措辭。
#
# 來源是 triangulation:公開規範 + 該專案 54 份質化筆記收斂出的寫作工藝樣態。
# 而那個專案跑完六個 phase 的結論正是
# **「星數關聯的是打包面,不是內容工藝 —— craft 才是主判」** ——
# 所以 craft-first + triangulation 是**遵循那個結論**,不是繞過它。
#
# 可以說:「這條規則的依據是 X」。
# 不可以說:「資料顯示做這個會更受歡迎」。**我們沒有那個資料。**

triangulation_sources:
  status: |
    ⚠️ **部分查證(2026-09-02)**。三個來源已逐條開啟原文核對,兩個仍待查證。
    **未查證者的引用只有中等證據強度** —— 這條紀律不因其他來源查過而放寬。
    ⚠️ 查證的是「**來源說了什麼**」,不是「**本 rubric 的權重對不對**」。
    來源查證**不會**把「選的權重」升級成「量出來的權重」;證據性質段那句仍然成立。
  sources:
    - source: "GitHub Docs — About READMEs"
      verified: "2026-09-02"
      found: |
        README 應涵蓋五項:What the project does / Why the project is useful /
        How users can get started / **Where users can get help** /
        **Who maintains and contributes to the project**。
        另:相對連結會依當前 branch 自動轉換(絕對連結在 clone 內可能失效);
        GitHub 依標題自動產生 TOC;anchor 可從渲染後的標題直接複製。
      gap_against_this_rubric: |
        後兩項原本無維度承載 —— **2026-09-02 批次處理已新增 R-005 承載**
        (Where users can get help / Who maintains 兩項)。
    - source: "Standard Readme(RichardLitt/standard-readme)spec.md"
      verified: "2026-09-02"
      found: |
        必要段落與順序:Title / Short Description / Table of Contents /
        Install / Usage / Contributing / License(Banner、Badges、Long Description、
        Security、Background、API、Maintainers、Thanks 為選用)。
        Title:"Title must match repository, folder and package manager names"。
        Short Description:"Must not have its own title" / "Must be less than 120
        characters" / "Must not start with `> `" / "Must be on its own line"。
        Contributing:"State where users can ask questions"。
        Maintainers:"List maintainer(s)… along with one way of contacting them"。
      gap_against_this_rubric: |
        Title 規則曾與 H-002 直接矛盾(spec 要求標題等於 repo 名,H-002 在扣這個分)
        —— **2026-09-02 批次處理已撤銷該扣分**(H-002 0.2.0 只報事實)。
        ⚠️ 本 repo 自己的 README 違反 Short Description 的三條規則(定位句在 blockquote 裡)。
        **那是分歧不是錯誤**(GitHub Docs 無此規定),分歧已在 README 註明。
    - source: "matiassingers/awesome-readme"
      verified: "2026-09-02"
      new_in: "2026-09-02"
      found: |
        120+ 個人工策展的 README,**逐條附收錄理由**。
        抽樣六條理由的關鍵詞集中在:logo / banner / badge / screenshot / demo /
        clear description / step-by-step installing instructions / TOC。
      gap_against_this_rubric: |
        ⚠️ **六條理由沒有一條提到 R-004 要的東西**(限制、非目標、易腐內容的時效標記),
        也沒有一條提到 R-002 的前置條件。
        ⚠️ **但這不足以推翻 R-004**:該策展標準本身高度偏視覺/打包面,
        而姊妹專案的結論正是「打包面關聯星數、不關聯工藝」——
        「偏打包面的標準不提 R-004」既可讀成 R-004 過重,也可讀成該標準沒在看工藝。
        **兩種讀法資料分不開。** 能寫下的只有:R-004 目前**無外部支持**
        (它在首兩批的觸發集中度見批次報告;decision_order 已於 0.2.0 改寫)。
    - source: "Make a README(makeareadme.com)—— 最小可用 README 的組成"
      verified: null
      note: "⏳ 待查證。憑既有知識引用,中等證據強度。"
    - source: "Diátaxis / Divio documentation system —— tutorial / how-to / reference / explanation 四象限"
      verified: null
      note: "⏳ 待查證。憑既有知識引用,中等證據強度。"
    - source: "skill-quality-research 的 54 份質化筆記 —— 寫作工藝樣態(why 密度、Bad/Good 對照、override 節)"
      verified: "2026-09-01"
      note: "同一作者的姊妹專案,已進版控可直接查閱;**非獨立第三方**,證據強度按此折扣。"

# ════════════════════════════════════════════════════════════════════════
# observation-only:有數字,但**不得轉成權重**
# ════════════════════════════════════════════════════════════════════════
observation_only:
  note: |
    以下四項來自 skill-quality-research 的 `feature_matrix.json`(80 個 repo,
    2026-08-16 快照)。**母體是 Agent Skill repo,不是一般 GitHub**;
    且 T3 層只有 **n=3**。列在這裡是為了讓讀者知道「有人量過什麼」,
    **不外推、不進計分**。本 rubric 的任何一條都不以這些數字為依據。
  data:
    install_oneliner_in_readme: {all: 68, T0: 50, T1: 60, T2: 71, T3: 100}
    readme_has_metrics:         {all: 60, T0: 50, T1: 40, T2: 69, T3: 50}
    readme_has_before_after:    {all: 39, T0: 38, T1: 40, T2: 35, T3: 67}
    readme_has_demo_media:      {all: 24, T0: 12, T1: 20, T2: 29, T3: 17}

# ════════════════════════════════════════════════════════════════════════
# A. hygiene 門檻(確定性,不加分,error 級不過即 needs-revision)
# ════════════════════════════════════════════════════════════════════════
hygiene:
  - id: H-001
    dimension: existence
    check_type: script
    source: triangulation
    rule: "存在一份非空的 README"
    pass_criteria: "找得到 README(.md/.rst/無副檔名)且去除空白後非空"
    severity: error
    mechanism: "沒有 README,GitHub 首頁就沒有任何說明;這是唯一無爭議的門檻"

  - id: H-002
    dimension: structure
    check_type: script
    source: triangulation
    rule: "有文字 H1 標題(ATX / setext / HTML 皆認)"
    pass_criteria: "存在有文字的 H1;「H1 等於 repo 名」只回報事實,不影響 pass"
    severity: info
    mechanism: "文字標題是渲染錨點與可及性的基礎;定位好壞由 R-001 判,本條只報結構事實"
    # 2026-09-02 批次修:撤銷「H1 等於 repo 名」的扣分(與本 rubric 引用的
    # Standard Readme Title 規則直接矛盾),severity 降 info。理由與實測見批次報告。
    known_false_positives: |
      有些 repo 刻意用 logo 圖片取代 H1(常見於品牌型專案;實測占比見批次報告)。
      偵測看不出「圖片承載了標題功能」——**這一條交給步驟 4 的 LLM 複核**,
      lint 只負責指出「沒有文字 H1」這個事實。

  - id: H-003
    dimension: structure
    check_type: script
    source: triangulation
    rule: "有安裝或使用的段落"
    pass_criteria: "標題含 install / usage / quick start / getting started / 安裝 / 使用 / 快速開始 等"
    severity: warning
    mechanism: "讀者來 README 最常見的目的是「怎麼開始用」"
    exemption: |
      **awesome 清單型 / 純資料型 repo 判 N/A**(它們沒有「安裝」這回事)。
      形狀判定見 SKILL.md 步驟 3。

  - id: H-004
    dimension: rendering
    check_type: script
    source: triangulation
    rule: "code fence 標語言"
    pass_criteria: "≥70% 的 ``` 區塊帶語言標註"
    severity: info
    mechanism: "GitHub 靠語言標註上色;不標的區塊在網頁上是一片灰"
    threshold_is_a_choice: |
      ⚠️ **70% 是選的,不是量出最適值。** 選它的理由:允許少量純輸出/純文字區塊
      (那些本來就不該標語言),但不允許整份都不標。
      **若實測誤判偏多,先懷疑這個門檻。**
    known_false_positives: |
      目錄樹、對話樣張、ASCII 示意圖本就無語言可標(```text 可標但非慣例)——
      未標註 fence 屬此類時不是缺陷。2026-09-02 批次查證後裁決門檻與 severity
      皆不動(info 級不進 verdict),抽查數字見批次報告。

  - id: H-005
    dimension: rendering
    check_type: script
    source: triangulation
    rule: "repo 內的相對連結指得到東西"
    pass_criteria: "README 內所有非 http 的 [](...) 目標在 repo 內存在"
    severity: warning
    mechanism: "死連結是讀者最快失去信任的地方,而且是確定性可測的"
    detection_note: |
      只驗**相對路徑**與 **同檔 anchor**;外部 http 連結**不驗**(需要網路,且會偽陰性)。
      anchor 比對用 GitHub 的 slug 規則(小寫、去標點、**空白逐個轉 `-`**——
      連續空白不折疊,`Art & Design` → `art--design`),**中日韓字元保留**;
      標題認 ATX / setext / HTML 三種語法,`<a name=>` 與 `id=` 也是合法目標。
    precondition: |
      ⚠️ **需要完整的 repo,不是一個 README 檔。** 只餵單檔時所有相對路徑
      當然指不到東西 —— 那是抽樣假陽性不是死鏈(實測教訓見誤判批次報告)。
      lint 在 root 無子目錄且檔案極少時會在 note 裡明說。

# ════════════════════════════════════════════════════════════════════════
# B. craft_llm —— **主判**(lint 做不到,也不該假裝做得到)
# ════════════════════════════════════════════════════════════════════════
# 取值:good / mixed / poor / n/a。`n/a` 只在形狀表明文豁免時使用。
# R-001~R-003 共用的取值映射 —— 判讀者**不得自選讀法**。
# 2026-09-02 批次補:首批判讀發現條文只寫「基礎/高分」而沒映射到取值域,
# 判讀者被迫自選 —— 那是信度殺手(兩個人判不一樣),姊妹專案的 κ 量測就死在這裡。
craft_value_mapping: |
  good  = 基礎達成(高分要件只影響敘述強度,**不影響取值**)
  mixed = 基礎部分達成,或達成但有可指認的瑕疵
  poor  = 基礎未達成
  n/a   = 該維度對此形狀不適用(查 SKILL.md 形狀表與各條 exemption)
  例外:R-004 與 R-005 有自己的 decision_order,以該序為準。

craft_llm:
  - id: R-001
    dimension: first_screen
    check_type: llm
    source: triangulation
    rule: "第一屏(標題 + 前 ~15 行)就回答:這是什麼、給誰、解決什麼問題"
    pass_criteria: |
      基礎:讀完第一屏能用一句話說出「它是什麼、我是不是目標讀者」。
      高分:再加上**與替代方案的差別**(為什麼用它而不是別的)。
    anti_patterns:
      - "badge 牆先行 —— 徽章佔滿第一屏而正文還沒開始"
      - "標題只有專案名,沒有一句話定位"
      - "第一段先講作者動機/心路歷程,而不是讀者要什麼"
      - "只有抽象形容詞(『強大』『優雅』『現代化』)而沒有具體能力"
    disambiguation: |
      「第一屏」不是精確行數,是**讀者滾動前看到的東西**。判別法:
      **遮住第 15 行之後,問「我知道要不要繼續讀嗎」**。
      ⚠️ badge 不是罪 —— 兩三個狀態徽章是慣例。判準是**它們有沒有把定位擠掉**。
    mechanism: "README 的第一屏就是 skill 的 description:它決定讀者留不留下來"

  - id: R-002
    dimension: shortest_path
    check_type: llm
    source: triangulation
    rule: "從零到跑起來的最短路徑是完整且可貼的"
    pass_criteria: |
      基礎:有可直接複製的指令,**前置條件明說**(語言版本、作業系統、必要帳號/金鑰)。
      高分:再加上**成功長什麼樣**(預期輸出/畫面),讓讀者知道自己有沒有裝對。
    anti_patterns:
      - "指令有隱含前置條件(需要 Docker / 特定版本)卻沒說"
      - "只有 `npm install`,沒有「然後呢」"
      - "範例指令帶佔位符卻沒說去哪拿(`<YOUR_API_KEY>` 而無取得說明)"
      - "安裝段落與實際 release/套件名不一致"
    exemption: |
      **研究/論文型**:若專案本身不是給人跑的(資料集、報告),R-002 判 `n/a`,
      改由 R-004(可複現性與資料說明)承載。
      **awesome 清單型**:判 `n/a`。
      形狀判定見 SKILL.md 步驟 3。
    mechanism: "讀者的第一次失敗多半發生在這裡,而失敗一次就不會有第二次"

  - id: R-003
    dimension: writing_quality
    check_type: llm
    source: triangulation
    rule: "解釋 why 而非只列 what;用具體例子而非抽象形容"
    pass_criteria: |
      基礎:關鍵選擇附理由(為什麼這樣設計/為什麼建議這個做法);
      有**具體例子或輸出樣張**,而不是只有形容詞。
      高分:有 before/after 或 Bad/Good 對照,或一個能實際套用得出二元結論的判別法。
    equivalent_forms: |
      「具體例子」不限散文對照,以下等價計分:
      - **輸出樣張**:貼一段真實輸出/截圖,讓讀者看到結果長什麼樣
      - **結構化表格**:用比較表、決策表承載「這樣做/不這樣做」
      - **可證偽的判別法**:給一個讀者能實際套用並得出是/否的測試
    anti_patterns:
      - "整份都是功能清單,零個例子"
      - "『支援 X』但沒有一行 X 的用法"
      - "changelog / 版本註記侵入正文"
    mechanism: "解釋 why 讓讀者能在未列舉的情境下自己判斷;只列 what 只能照抄"

  - id: R-004
    dimension: honest_limits
    check_type: llm
    source: triangulation
    rule: "說出什麼時候**不該**用、已知限制、以及易腐內容的時效"
    pass_criteria: |
      基礎:有任何一項 —— 非目標(non-goals)、已知限制、適用邊界、維護狀態。
      高分:易腐內容(版本號、第三方 API、定價、效能數字)帶**時效標記或驗證方式**。
    decision_order: |
      照序判,第一個成立者為準:
        1. 有限制/非目標/適用邊界/維護狀態陳述,**且**易腐內容帶時效標記
           或驗證方式(含下方機械同步形式)→ `good`
        2. 有上述陳述,但易腐內容裸露、**或已實際腐壞**(死 badge、
           指向已消失的服務)→ `mixed`
        3. 無上述陳述,但易腐內容有**機械同步形式**(見 equivalent_forms)→ `mixed`
        4. 無上述,也**沒有易腐內容**(純概念說明、無版本無數字)→ `n/a`
        5. 無上述,而易腐內容**裸露**(版本號/API/定價/效能宣稱直接寫死)→ `poor`
      ⚠️ 順序 4 與 5 的差別是「**有沒有東西會過期**」,不是篇幅。
    equivalent_forms: |
      「機械同步形式」—— 易腐內容交給機器維護,等價於驗證方式:
      - **指向單一事實源而不複製**(如「check `engines` in package.json」)
      - **repo 內相對路徑**(隨版控天然同步,斷了 GitHub 直接顯示)
      - **自動生成/機械同步標記**且有 CI 驗證痕跡(如 `<!-- COUNT -->` 對標)
      ⚠️ **指向外部文件網站不算** —— 外部 docs 一樣會腐,只是腐在別處。
    # decision_order 於 2026-09-02 批次改寫;理由與實測數字**刻意不寫在這裡**
    # (理由段會污染下一輪判讀),見 CHANGELOG 0.2.0 與批次處理報告。
    anti_patterns:
      - "效能/準確率數字無來源、無日期、無重現方式"
      - "宣稱支援 N 種平台/工具,而沒有任何一種有實測痕跡"
      - "文件描述的行為與程式碼已不一致(可從版本/API 名稱看出)"
    mechanism: |
      README 是專案對外唯一保證會被讀的檔案,也是最容易腐爛的檔案。
      **把限制寫出來的專案,通常也是文件會被維護的專案。**
    evidence_note: |
      本條的形狀直接借自 skill-quality-research 的 L-004(anti-hallucination),
      那一條是該專案跨兩輪一致性量測中**信度最低**的維度(κ=0.400)。
      ⚠️ **本條若過度觸發,先懷疑它,不要先調 rollup 門檻。**

  - id: R-005
    dimension: support_and_maintenance
    check_type: llm
    source: triangulation
    rule: "讀者卡住時知道去哪求助;知道這個專案由誰、以什麼狀態維護"
    pass_criteria: |
      基礎:求助管道**或**維護主體其一可明確指認。
      高分:兩者皆有,且求助管道有分流(先看 FAQ / 怎麼報 bug / 去哪問問題)。
    decision_order: |
      照序判,第一個成立者為準:
        1. 有管道/維護資訊但**已失效或誤導**(死的聊天室連結、宣稱活躍實已
           archived)→ `poor` —— 錯的資訊比沒有更糟
        2. 求助管道與維護主體**皆**可指認 → `good`
        3. 僅其一可指認 → `mixed`
        4. 兩者皆不可指認 → `mixed`
      ⚠️ 缺席**刻意不設 poor**:GitHub 預設就有 Issues 頁籤,README 沒寫是弱點
      不是失格。poor 只保留給「寫了但是錯的」。
    disambiguation: |
      判準是「**讀者知不知道自己的處境**」,不是「有沒有 Discord」:
      - 「本專案不提供支援 / 不收 PR」是**合格答案**(維護狀態陳述)→ 計入順序 2/3
      - 維護主體可從 README 內文指認即可(具名作者、組織名、基金會);
        **只有 repo URL 裡的帳號名不算內文指認**
    exemption: |
      **內部工具 / 個人筆記型**(讀者與維護者同一圈子,求助路徑是走過去問)
      → `n/a`。形狀判定見 SKILL.md 步驟 3。
    anti_patterns:
      - "聊天室/論壇連結已死(freenode 型鏈腐)而 README 未更新"
      - "求助管道只在贊助商區塊裡,分不清是社群的還是廠商的"
      - "宣稱歡迎貢獻,但 CONTRIBUTING 連結指不到東西"
    mechanism: |
      GitHub Docs 五項內容的第 4、5 項(Where users can get help /
      Who maintains and contributes),Standard Readme 的 Contributing
      ("State where users can ask questions")與 Maintainers 條款獨立佐證
      (兩者皆 2026-09-02 逐字查證)。README 是讀者判斷「這個專案背後有沒有人」
      的唯一入口 —— 答不出來的專案,讀者會假設最壞情況。
    evidence_note: |
      2026-09-02 批次新增。依據是兩個獨立規範的明文條款(見 mechanism),
      **不是**星數梯度 —— 本 rubric 沒有那種資料。新增理由與 rollup 分母
      影響的實測見批次報告;⚠️ 本條沒有跨批次的觸發率紀錄,首兩批的
      重模擬不算(判讀者同一人)。

# ════════════════════════════════════════════════════════════════════════
# C. security(門檻,不加分。標示 ≠ 禁止)
# ════════════════════════════════════════════════════════════════════════
# confidence 的值域與語意:
#   low-static-needs-llm — regex 假陽性高,**不足以單獨支撐判定**,
#                          必須由 SKILL.md 步驟 5 複核確認才算數。
#   medium               — 比對命令字面而非散文語意,假陽性率最低,
#                          **推翻它需要最強的證據,不是最弱的**。
security:
  - id: S-001
    dimension: security
    check_type: hybrid
    rule: "`curl … | sh` 型一行安裝"
    pass_criteria: "README 不以管道到 shell 作為**唯一或首選**安裝路徑"
    severity: warning
    confidence:
      pipe_to_shell: medium
    stance: |
      ⚠️ **標示,不禁止。** `curl | bash` 是被廣泛使用的慣例,很多正當專案這樣做。
      本條要的是**讀者知道自己在執行什麼**:有沒有並列非管道路徑、
      有沒有讓人先看腳本。
      **可查證的先例**:skill-quality-research 明文為此拒絕補上自己的
      `install_oneliner_in_readme` 一格,理由是「一個做安全審查的工具去推廣
      `curl | bash`,自相矛盾」—— 那是一個**專案自己的取捨**,不是通則。
    mechanism: "管道到 shell 讓讀者無法在執行前檢視內容,擴大供應鏈面"

  - id: S-002
    dimension: security
    check_type: hybrid
    rule: "範例裡不出現真實憑證"
    pass_criteria: "不出現看起來像真實 token/key 的字串"
    severity: error
    confidence:
      real_looking_secret: low-static-needs-llm
    detection_note: |
      只認**高熵且帶已知前綴**的樣態(`ghp_`/`sk-`/`AKIA` 等)。
      佔位符(`<YOUR_TOKEN>`、`xxx`、`...`)**不算命中**。
      ⚠️ 假陽性高:文件在**談論**憑證格式時會命中。必須經步驟 5 複核。
    mechanism: "README 是最容易被複製貼上的地方,誤貼的憑證會直接進版控"

  - id: S-003
    dimension: security
    check_type: hybrid
    rule: "不指示讀者執行未經檢視的遠端內容"
    pass_criteria: "不出現「照著印出來的內容執行」「不要停下來確認」類指令"
    severity: warning
    confidence:
      obey_remote_output: low-static-needs-llm
    detection_note: |
      ⚠️ 這一條在姊妹專案有**具名的極性反轉前科**:regex 曾把
      「**DO NOT PROCEED** without confirmation」(強制確認)判成抑制確認。
      **正向 marker 認不出否定式** —— 命中一律當低信心,交步驟 5。
    mechanism: "把指令來源移到 README 外,靜態審查覆蓋不到實際被執行的東西"

# ════════════════════════════════════════════════════════════════════════
# D. verdict rollup —— **canonical 只有這一份**
# ════════════════════════════════════════════════════════════════════════
craft_verdict_rollup:
  values: [approved, approved-with-notes, needs-revision]
  order: |
    照序判,第一個成立者為準:
      1. hygiene 有 severity: error 未過                     → needs-revision
      2. security 有 error 級紅旗且經步驟 5 複核確認成立       → needs-revision
      3. 任一 craft 維度判 poor                              → needs-revision
      4. ≥2 個 craft 維度判 mixed(n/a 不計入)               → needs-revision
      5. 恰 1 個維度 mixed                                   → approved-with-notes
      6. 其餘(無 mixed 無 poor)                             → approved
  why_mixed_costs_from_day_one: |
    ⚠️ **這一條是從姊妹專案的實測缺陷直接繼承來的,不是設計偏好。**

    skill-quality-research 的 craft verdict 原本只有 `poor` 觸發 needs-revision,
    而 `poor` 在 54 份質化筆記中只佔 **1.9–3.7%**。實測後果:
    **連續 41 個對象、約 152 個維度標記,41/41 全是 `approved`** ——
    史上零次由 craft 觸發 needs-revision。
    三次不知情實測的 12 個維度標記是 **7 mixed / 5 good / poor 零個**,零開火。

    **一個從來不說「不」的判準,從外面看跟橡皮圖章無法區分。**

    ⇒ 本專案第一天就讓 `mixed` 計費。`mixed` 正是審查者用來標示「這裡有問題」的那一格。
  threshold_is_a_choice: |
    ⚠️ **`≥2` 是選的,不是量出最適值。** 姊妹專案對 54 份筆記模擬的觸發率是
    現行(任一 poor)1.9–3.7% → `≥2 mixed` **20.4%** → `≥3 mixed` 5.6–11.1%,
    而 `≥2` 在兩套標籤解析下都是 20.4%(不受複合標籤歧義影響)。
    **本專案沒有自己的模擬** —— 這個門檻是**借來的**,必須在 Phase 6 用真實 README 實測。
    若觸發率明顯偏離,先懷疑 R-004(借自信度最低的 L-004),再考慮動門檻。
  denominator_note: |
    2026-09-02 起 craft 維度為五(R-001~R-005)。門檻維持**絕對值 2**,
    刻意不隨分母調整 —— 調整理由若成立,應改門檻常數本身並留紀錄,
    而不是讓它隨維度數靜默漂移。加維前後的 verdict 重模擬見批次報告。
  na_boundary: |
    門檻是**絕對值 2**,不是「非 n/a 維度的過半」。
    「2 個 n/a + 2 個 mixed」與「4 維全判 + 2 個 mixed」**同罰** ——
    n/a 表示該維度不適用,不該讓其餘維度變便宜或變貴。

# ════════════════════════════════════════════════════════════════════════
# E. 措辭紀律
# ════════════════════════════════════════════════════════════════════════
wording_discipline: |
  1. **不得宣稱星數/受歡迎程度的關聯。** 本 rubric 沒有那個資料。
     可以說「這條的依據是 X」,不可以說「資料顯示這樣做會更受歡迎」。
  2. **lint 分數不是品質結論。** 它是 hygiene 門檻與安全過濾器,
     craft verdict 才是主判 —— 這是姊妹專案六個 phase 的結論。
  3. **形狀先於準則。** 把 library 的標準套到 awesome 清單上是最常見的誤判來源。
  4. 判 `good` 也要附證據 ——「找不到問題」和「查過而且它做對了」是兩件事。
